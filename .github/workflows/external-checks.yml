name: VYNOX LAYER build and deployment checks
on:
  pull_request:
  push:
    # main is checked once through external-sync's reusable checks job.
    branches: [qxlayer-staging]
  workflow_call:
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-latest
    services:
      # Disposable CI fixture only: never Production or copied customer data.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qxlayer_ci_disposable_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:qxlayer_ci_disposable_only@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:qxlayer_ci_disposable_only@127.0.0.1:5432/postgres
      QXLAYER_MIGRATION_TEST: "true"
      QXLAYER_EXTERNAL_MIGRATIONS_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run external:test
      - run: pnpm run release:test
      - run: pnpm run external:test:database
      - name: Build shared tenant SPA for release regressions
        run: pnpm --filter @workspace/private-label-website run build
        env:
          PORT: "3001"
          BASE_PATH: /private-label-website/
      - name: Install disposable browser
        run: pnpm --filter @workspace/api-server exec playwright install --with-deps chromium
      - name: Eight tenant-release regression categories and public-browser proof
        run: |
          # Fresh signing key for this disposable test process, never a hosted secret.
          export SESSION_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$SESSION_SECRET"
          pnpm --filter @workspace/api-server exec tsx src/verification/site-releases.ts --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-sync-browser-evidence
          path: generated-artifacts/release-sync/
          if-no-files-found: ignore
      - run: pnpm --filter @workspace/api-server run build
      - name: Build isolated frontend package (no hosted account or real key)
        run: pnpm run external:build:frontend
        env:
          QXLAYER_API_ORIGIN: https://qxlayer-ci-placeholder.onrender.com
          QXLAYER_AUTH_PROVIDER: supabase
          QXLAYER_EXTERNAL_ENVIRONMENT: staging
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5pbnZhbGlkJA
          VITE_CLERK_PROXY_URL: https://qxlayer-ci.example.invalid/api/__clerk
