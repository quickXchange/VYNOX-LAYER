openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sandbox administration and multi-tenant provisioning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: platform
    description: Platform operator foundation
  - name: tenants
    description: Tenant administration and provisioning
  - name: catalog
    description: Sandbox product, asset, and network catalogs
paths:
  /public/site-config:
    get:
      operationId: getReleasedSiteConfig
      parameters:
        - {name: slug, in: query, schema: {type: string}}
        - {name: host, in: query, schema: {type: string}}
      responses:
        "200": {description: Immutable live presentation; ETag is checksum, content: {application/json: {schema: {$ref: "#/components/schemas/ReleasedSiteConfig"}}}}
        "304": {description: Release unchanged}
        "404": {description: Site not found or not released}
  /tenants/{tenantId}/releases:
    get:
      operationId: getTenantReleases
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      responses:
        "200": {description: Authorized history and readiness, content: {application/json: {schema: {$ref: "#/components/schemas/TenantReleaseState"}}}}
    post:
      operationId: releaseTenantSite
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      responses:
        "201": {description: Atomic data release; no deployment or activation, content: {application/json: {schema: {$ref: "#/components/schemas/TenantReleaseMetadata"}}}}
        "409": {description: Draft validation failed}
  /tenants/{tenantId}/releases/{releaseId}/rollback:
    post:
      operationId: rollbackTenantSite
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
        - {name: releaseId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Live pointer changed; draft unchanged, content: {application/json: {schema: {$ref: "#/components/schemas/TenantReleaseMetadata"}}}}
  /tenants/{tenantId}/release-preview:
    post:
      operationId: previewTenantDraft
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      responses:
        "200":
          description: Short-lived authorized draft preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  expiresAt: {type: string}
                required: [url, expiresAt]
  /tenants/{tenantId}/release-assets:
    post:
      operationId: uploadTenantDraftAsset
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Private draft asset URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                required: [url]
  /exchange/catalog:
    get:
      operationId: getGlobalExchangeCatalog
      tags: [catalog]
      responses:
        "200":
          description: Global reference catalogs, not live financial integrations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GlobalExchangeCatalog"}
  /operator/exchange/catalog:
    post:
      operationId: patchGlobalExchangeCatalog
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GlobalCatalogPatch"}
      responses:
        "200":
          description: Atomically updated catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GlobalExchangeCatalog"}
  /tenants/{tenantId}/exchange/wallets/{walletId}/scan:
    post:
      operationId: scanExchangeWallet
      parameters:
        - {in: path, name: tenantId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: walletId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeWalletScanInput"}
      responses:
        "200":
          description: Read-only bounded blockchain observations; never financial settlement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangeWalletScan"}
  /phase1/catalog:
    $ref: './phase1-commerce.yaml#/paths/~1phase1~1catalog'
  /operator/phase1/methods:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1methods'
  /operator/phase1/methods/{id}:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1methods~1{id}'
  /customer/phase1/orders/{id}:
    $ref: './phase1-commerce.yaml#/paths/~1customer~1phase1~1orders~1{id}'
  /operator/phase1/orders/{id}:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1orders~1{id}'
  /customer/phase1/orders/{id}/checkout:
    $ref: './phase1-commerce.yaml#/paths/~1customer~1phase1~1orders~1{id}~1checkout'
  /customer/phase1/orders/{id}/report:
    $ref: './phase1-commerce.yaml#/paths/~1customer~1phase1~1orders~1{id}~1report'
  /operator/phase1/invoices/{id}/confirm:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1invoices~1{id}~1confirm'
  /operator/phase1/invoices/{id}/reject:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1invoices~1{id}~1reject'
  /operator/phase1/emails:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1emails'
  /operator/phase1/emails/{id}/retry:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1emails~1{id}~1retry'
  /operator/phase1/proposals:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1proposals'
  /operator/phase1/proposals/{kind}/{id}/approve:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1proposals~1{kind}~1{id}~1approve'
  /operator/phase1/plans/{id}/periods:
    $ref: './phase1-commerce.yaml#/paths/~1operator~1phase1~1plans~1{id}~1periods'
  /supabase-auth/status:
    $ref: './supabase-auth.yaml#/paths/~1supabase-auth~1status'
  /supabase-auth/session:
    $ref: './supabase-auth.yaml#/paths/~1supabase-auth~1session'
  /supabase-auth/action:
    $ref: './supabase-auth.yaml#/paths/~1supabase-auth~1action'
  /public/sites/{slug}/telegram/config:
    $ref: './integration-runtime.yaml#/paths/~1public~1sites~1{slug}~1telegram~1config'
  /tenants/{tenantId}/integrations/telegram_bot/webhook:
    $ref: './integration-runtime.yaml#/paths/~1tenants~1{tenantId}~1integrations~1telegram_bot~1webhook'
  /integrations/runtime:
    $ref: './integration-runtime.yaml#/paths/~1integrations~1runtime'
  /tenants/{tenantId}/integrations:
    $ref: './integration-runtime.yaml#/paths/~1tenants~1{tenantId}~1integrations'
  /tenants/{tenantId}/integrations/{providerKey}:
    $ref: './integration-runtime.yaml#/paths/~1tenants~1{tenantId}~1integrations~1{providerKey}'
  /tenants/{tenantId}/integrations/{providerKey}/test:
    $ref: './integration-runtime.yaml#/paths/~1tenants~1{tenantId}~1integrations~1{providerKey}~1test'
  /providers/foundation:
    get:
      operationId: getProviderFoundation
      tags: [platform]
      responses:
        "200":
          description: Super Admin provider catalog and scoped configuration, no secrets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderFoundation"}
  /providers/catalog:
    post:
      operationId: createProviderDefinition
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderDefinitionInput"}
      responses:
        "201":
          description: Created metadata only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderDefinition"}
  /providers/catalog/{providerId}:
    put:
      operationId: updateProviderDefinition
      tags: [platform]
      parameters:
        - {name: providerId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderDefinitionInput"}
      responses:
        "200":
          description: Updated metadata only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderDefinition"}
  /tenants/{tenantId}/provider-foundation:
    get:
      operationId: getTenantProviderFoundation
      tags: [tenants]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Only this tenant's allowed providers and assignments
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderFoundation"}
  /tenants/{tenantId}/provider-assignments:
    post:
      operationId: createProviderAssignment
      tags: [tenants]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderAssignmentInput"}
      responses:
        "201":
          description: Super Admin assignment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderAssignment"}
  /tenants/{tenantId}/provider-assignments/{assignmentId}:
    put:
      operationId: updateProviderAssignment
      tags: [tenants]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderConfigurationInput"}
      responses:
        "200":
          description: Validated non-secret configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderAssignment"}
    delete:
      operationId: removeProviderAssignment
      tags: [tenants]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204":
          description: Super Admin removal; policies referencing the assignment must be cleared first
  /tenants/{tenantId}/provider-policies:
    put:
      operationId: saveProviderPolicy
      tags: [tenants]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderPolicyInput"}
      responses:
        "200":
          description: Future policy only, sandbox execution unchanged
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderPolicy"}
  /tenants/{tenantId}/provider-policies/{policyId}:
    delete:
      operationId: removeProviderPolicy
      tags: [tenants]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: policyId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Future policy removed}
  /platform-management:
    get:
      operationId: getPlatformManagement
      tags: [platform]
      summary: Read-only platform owner account, project, usage and audit directory
      responses:
        "200":
          description: Management data; unavailable identity directory is explicit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformManagement"
        "401":
          description: Sign-in required
        "403":
          description: Super administrator required
  /tenants/{tenantId}/website-preview:
    get:
      operationId: getTenantWebsitePreview
      tags: [Tenants]
      summary: Get an authenticated operator-only read-only website preview without activation
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authenticated launcher; issues a 15-minute tenant-scoped cookie and requires fresh Super Admin authorization on every preview request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsitePreview"
  /exchange/visual-catalog:
    get:
      operationId: getExchangeVisualCatalog
      responses:
        "200":
          description: Public visual identities only; no tenant or order data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeVisualCatalog"
  /demo/session:
    get:
      operationId: getDemoSession
      responses:
        "200": {description: Current isolated read-only demo session; explicit per-tab intent required, content: {application/json: {schema: {$ref: "#/components/schemas/DemoSession"}}}}
    post:
      operationId: startDemoSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DemoLaunchInput"}
      responses:
        "200": {description: Restricted read-only demo session, content: {application/json: {schema: {$ref: "#/components/schemas/DemoSession"}}}}
        "400": {description: Demo entry takes no credentials or authority fields}
        "503": {description: Secure session signing unavailable}
    delete:
      operationId: endDemoSession
      responses:
        "200": {description: Demo session ended, content: {application/json: {schema: {$ref: "#/components/schemas/DemoSession"}}}}
  /customer/white-label-catalog:
    get:
      operationId: getWhiteLabelCatalog
      responses:
        "200": {description: Existing enabled Exchange plans and add-ons, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelCatalog"}}}}
  /customer/white-label-requests/{requestId}:
    get:
      operationId: getMyWhiteLabelRequest
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Own order with customer-visible history only, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelOrderDetail"}}}}
  /operator/white-label-requests/{requestId}:
    get:
      operationId: getWhiteLabelRequest
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Super Admin order and complete history, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelOrderDetail"}}}}
  /operator/white-label-requests/{requestId}/notes:
    post:
      operationId: addWhiteLabelNote
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelNoteInput"}}}}
      responses:
        "201": {description: Appended immutable note, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelEvent"}}}}
  /operator/white-label-requests/{requestId}/provisioning:
    get:
      operationId: getWhiteLabelProvisioning
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Actual provisioning progress and actionable blockers, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelProvisioning"}}}}
    post:
      operationId: retryWhiteLabelProvisioning
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Idempotently resume approved provisioning without copying customer data, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelProvisioning"}}}}
  /customer/admin-panels:
    get:
      operationId: listMyAdminPanels
      responses:
        "200": {description: Provisioned Exchange projects authorized for the current VYNOX LAYER session, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CustomerAdminPanel"}}}}}
  /customer/white-label-requests:
    get:
      operationId: listMyWhiteLabelRequests
      responses:
        "200": {description: Current customer's orders, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}}
    post:
      operationId: submitWhiteLabelRequest
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequestInput"}}}}
      responses:
        "201": {description: Submitted Exchange request, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}
  /operator/white-label-requests:
    get:
      operationId: listWhiteLabelRequests
      responses:
        "200": {description: Super Admin request queue, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}}
  /operator/white-label-requests/{requestId}/review:
    put:
      operationId: reviewWhiteLabelRequest
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelReviewInput"}}}}
      responses:
        "200": {description: Operator-reviewed request, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}
  /operator/white-label-requests/{requestId}/provision:
    post:
      operationId: provisionWhiteLabelRequest
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeDeliveryInput"}
      responses:
        "200": {description: Completed handoff into the existing customer account, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}
  /tenants/{tenantId}/exchange/audit:
    get:
      operationId: listExchangeAudit
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Paginated tenant-scoped audit events, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeAuditList"}}}}
  /tenants/{tenantId}/exchange:
    parameters:
      - {$ref: "#/components/parameters/TenantId"}
    get:
      operationId: getExchangeConfiguration
      responses:
        "200": {description: Tenant sandbox configuration, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeConfiguration"}}}}
    put:
      operationId: saveExchangeConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeSettings"}
      responses:
        "200": {description: Saved sandbox configuration, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeConfiguration"}}}}
  /tenants/{tenantId}/exchange/test-quote:
    post:
      operationId: testExchangeQuote
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeQuoteInput"}
      responses:
        "200": {description: Read-only test of saved tenant pricing using the canonical public quote engine; never creates an order, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeQuote"}}}}
  /tenants/{tenantId}/exchange/orders:
    get:
      operationId: listExchangeOrders
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: view, in: query, description: Status group applied before pagination and counting., schema: {type: string, enum: [active, archived]}}
        - {name: status, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: to, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: customer, in: query, schema: {type: string, pattern: '^(anonymous|[a-f0-9]{64})$'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Paginated sandbox orders, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrderList"}}}}
  /tenants/{tenantId}/exchange/orders/{orderId}:
    parameters:
      - {$ref: "#/components/parameters/TenantId"}
      - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getExchangeOrder
      responses:
        "200": {description: Tenant order details, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrder"}}}}
    put:
      operationId: updateExchangeOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeStatusInput"}
      responses:
        "200": {description: Updated simulated order, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrder"}}}}
  /tenants/{tenantId}/exchange/dashboard:
    get:
      operationId: getExchangeDashboard
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
      responses:
        "200": {description: Sandbox exchange overview, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeDashboard"}}}}
  /tenants/{tenantId}/exchange/customers:
    get:
      operationId: listExchangeCustomers
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
      responses:
        "200": {description: Tenant-scoped customer summary; sandbox orders do not collect identity, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExchangeCustomer"}}}}}
  /public/sites/{slug}/exchange:
    get:
      operationId: getPublicExchange
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Public tenant exchange, content: {application/json: {schema: {$ref: "#/components/schemas/PublicExchange"}}}}
  /public/sites/{slug}/exchange/quotes:
    post:
      operationId: createSandboxQuote
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeQuoteInput"}
      responses:
        "200": {description: Signed sandbox quote, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeQuote"}}}}
  /public/sites/{slug}/exchange/review:
    post:
      operationId: reviewSandboxOrder
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeOrderInput"}
      responses:
        "200": {description: Read-only review after a valid signed quote and complete customer details; no order or financial execution, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrderReview"}}}}
  /public/sites/{slug}/exchange/orders:
    post:
      operationId: createSandboxOrder
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeOrderInput"}
      responses:
        "201": {description: Simulated order and private tracking capability, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrderCreated"}}}}
  /public/sites/{slug}/exchange/orders/{orderId}:
    get:
      operationId: trackSandboxOrder
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: trackingToken, in: header, required: true, schema: {type: string, minLength: 32, maxLength: 200}}
      responses:
        "200": {description: Capability-protected order tracking, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrder"}}}}
  /public/sites/{slug}/exchange/orders/{orderId}/invoice:
    get:
      operationId: downloadSandboxOrderInvoice
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: trackingToken, in: header, required: true, schema: {type: string, minLength: 32, maxLength: 200}}
      responses:
        "200":
          description: Tenant-branded simulated invoice protected by the private tracking capability. Not proof of payment.
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /tenants/{tenantId}/exchange/customers/{customerId}:
    patch:
      operationId: updateExchangeCustomer
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: customerId, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeCustomerUpdate"}
      responses:
        "200": {description: Updated tenant-local customer notes, content: {application/json: {schema: {$ref: "#/components/schemas/MutationStatus"}}}}
  /tenants/{tenantId}/exchange/notifications:
    get:
      operationId: getExchangeNotifications
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Persisted in-app order notifications; no outbound delivery, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeNotificationInbox"}}}}
    put:
