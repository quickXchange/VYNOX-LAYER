      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionCommercialInput"}}}}
      responses:
        "200": {description: Operator-managed commercial settings; no payment collection, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /customer/notifications:
    get:
      operationId: getCustomerNotifications
      tags: [customer]
      responses:
        "200": {description: Customer-owned order updates, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerNotifications"}}}}
  /customer/notifications/read:
    put:
      operationId: markCustomerNotificationsRead
      tags: [customer]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationReadInput"}}}}
      responses:
        "200": {description: Owned notifications acknowledged, content: {application/json: {schema: {$ref: "#/components/schemas/MutationStatus"}}}}
  /tenants/{tenantId}/subscription/add-ons:
    put:
      operationId: setTenantAddons
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionAddonInput"}}}}
      responses:
        "200": {description: Tenant add-ons changed, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/subscription/overrides:
    put:
      operationId: setTenantOverrides
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EntitlementOverrideInput"}}}}
      responses:
        "200": {description: Tenant-only overrides replaced, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/suspension:
    put:
      operationId: setTenantSuspension
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SuspensionInput"}}}}
      responses:
        "200": {description: Tenant suspension saved, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/website-settings:
    put:
      operationId: updateTenantWebsiteSettings
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WebsiteSettings"}}}}
      responses:
        "200": {description: Shared template settings saved, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
  /tenants/{tenantId}/resources/{resourceType}:
    parameters: [{$ref: "#/components/parameters/TenantId"}, {$ref: "#/components/parameters/ResourceType"}]
    get:
      operationId: listTenantResources
      tags: [tenants]
      responses:
        "200": {description: Sandbox resource configuration, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ResourceItem"}}}}}
    post:
      operationId: createTenantResource
      tags: [tenants]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ResourceInput"}}}}
      responses:
        "201": {description: Resource created with atomic quota enforcement, content: {application/json: {schema: {$ref: "#/components/schemas/ResourceCreated"}}}}
  /tenants/{tenantId}/resources/{resourceType}/{resourceId}:
    delete:
      operationId: removeTenantResource
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}, {$ref: "#/components/parameters/ResourceType"}, {name: resourceId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Resource removed or revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MutationStatus"}}}}
  /public/sites/{slug}/branding/{kind}:
    get:
      operationId: getPublicBrandingFile
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: kind, in: path, required: true, schema: {type: string, enum: [logo, favicon]}}
      responses:
        "200":
          description: Curated raster logo or favicon explicitly selected for this delivered tenant. Other order attachments remain private.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {description: Branding file unavailable}
  /public/sites/{slug}:
    get:
      operationId: getPublicSite
      tags: [catalog]
      parameters: [{name: slug, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}}]
      responses:
        "200": {description: Allowlisted public tenant website configuration, content: {application/json: {schema: {$ref: "#/components/schemas/PublicSite"}}}}
  /public/sites/{slug}/capabilities/{feature}:
    get:
      operationId: getPublicCapability
      tags: [catalog]
      parameters: [{name: slug, in: path, required: true, schema: {type: string}}, {name: feature, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Enabled foundation entry point; no product execution, content: {application/json: {schema: {$ref: "#/components/schemas/CapabilityStatus"}}}}
  /commerce/pricing-publication:
    get:
      operationId: getPricingPublication
      tags: [commerce]
      summary: Preview unpublished commercial pricing (Super Admin only)
      responses:
        "200":
          description: Current public snapshot and editable catalog preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingPublication'
    post:
      operationId: publishPricingPublication
      tags: [commerce]
      summary: Explicitly publish the reviewed pricing revision (Super Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingPublicationInput'
      responses:
        "200":
          description: Published pricing snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingPublication'
        "409":
          description: Draft or published revision changed; refresh and review again
components:
  parameters:
    PlanId: {name: planId, in: path, required: true, schema: {type: string, format: uuid}}
    ResourceType: {name: resourceType, in: path, required: true, schema: {type: string, enum: [staff, api_keys, webhooks, payment_methods]}}
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    PricingPublicationInput:
      type: object
      required: [expectedRevision, expectedPublishedRevision, reason]
      properties:
        expectedRevision: {type: string, pattern: '^[a-f0-9]{64}$'}
        expectedPublishedRevision: {type: [string, "null"], pattern: '^[a-f0-9]{64}$'}
        reason: {type: string, minLength: 3, maxLength: 500}
    PricingPublication:
      type: object
      required: [draftRevision, publishedRevision, publishedAt, draft, published]
      properties:
        draftRevision: {type: string}
        publishedRevision: {type: [string, "null"]}
        publishedAt: {type: [string, "null"]}
        draft: {type: object, additionalProperties: true}
        published: {type: [object, "null"], additionalProperties: true}
    WebsiteErrorDiagnostic:
      type: object
      additionalProperties: false
      required: [errorId, category, buildId]
      properties:
        errorId: {type: string, pattern: "^QXS-[a-f0-9]{32}$"}
        category: {type: string, enum: [render_type, missing_reference, script_syntax, asset_load, unknown]}
        buildId: {type: string, pattern: "^site-[a-f0-9]{16}$"}
    ProviderSchemaField:
      type: object
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,63}$"}
        label: {type: string, minLength: 1, maxLength: 100}
        type: {type: string, enum: [text, number, boolean, url, secret]}
        required: {type: boolean}
    ProviderDefinitionInput:
      type: object
      additionalProperties: false
      required: [name, logoUrl, description, categories, services, capabilities, status, environments, credentialSchema, configurationSchema, access, entitlementKey, tenantConfigurable]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        logoUrl: {type: [string, "null"], maxLength: 500}
        description: {type: string, maxLength: 2000}
        categories: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 80}}
        services: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 80}}
        capabilities: {type: array, minItems: 1, maxItems: 30, items: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}}
        status: {type: string, enum: [coming_soon, configuration_only, available, disabled]}
        environments: {type: array, minItems: 1, maxItems: 3, items: {type: string, enum: [sandbox, test, live]}}
        credentialSchema: {type: array, maxItems: 30, items: {$ref: "#/components/schemas/ProviderSchemaField"}}
        configurationSchema: {type: array, maxItems: 30, items: {$ref: "#/components/schemas/ProviderSchemaField"}}
        access: {type: string, enum: [platform_wide, entitlement, assigned]}
        entitlementKey: {type: [string, "null"], maxLength: 100}
        tenantConfigurable: {type: boolean}
    ProviderDefinition:
      allOf:
        - {$ref: "#/components/schemas/ProviderDefinitionInput"}
        - type: object
          required: [id, createdAt, updatedAt, implementationStatus, connectionStatus, assignedTenants, credentialStorageAvailable]
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string}
            updatedAt: {type: string}
            implementationStatus: {type: string, enum: [not_implemented]}
            connectionStatus: {type: string, enum: [not_configured]}
            assignedTenants: {type: integer}
            credentialStorageAvailable: {type: boolean}
    ProviderAssignmentInput:
      type: object
      additionalProperties: false
      required: [providerId, capability, environment]
      properties:
        providerId: {type: string, format: uuid}
        capability: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
        environment: {type: string, enum: [sandbox, test, live]}
    ProviderConfigurationInput:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration: {type: object, additionalProperties: {type: [string, number, boolean]}}
    ProviderAssignment:
      allOf:
        - {$ref: "#/components/schemas/ProviderAssignmentInput"}
        - {$ref: "#/components/schemas/ProviderConfigurationInput"}
        - type: object
          required: [id, tenantId, connectionStatus, credentialState, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            tenantId: {type: string, format: uuid}
            connectionStatus: {type: string, enum: [not_configured, configured]}
            credentialState: {type: string, enum: [not_configured]}
            createdAt: {type: string}
            updatedAt: {type: string}
    ProviderPolicyInput:
      type: object
      additionalProperties: false
      required: [scope, resourceId, capability, environment, executionMode, providerId, fallback, secondaryProviderId]
      properties:
        scope: {type: string, enum: [route, network]}
        resourceId: {type: string, minLength: 1, maxLength: 100}
        capability: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
        environment: {type: string, enum: [sandbox, test, live]}
        executionMode: {type: string, enum: [sandbox_manual, provider]}
        providerId: {type: [string, "null"], format: uuid}
        fallback: {type: string, enum: [none, manual, secondary_provider]}
        secondaryProviderId: {type: [string, "null"], format: uuid}
    ProviderPolicy:
      allOf:
        - {$ref: "#/components/schemas/ProviderPolicyInput"}
        - type: object
          required: [id, tenantId, executionEnabled, updatedAt]
          properties:
            id: {type: string, format: uuid}
            tenantId: {type: string, format: uuid}
            executionEnabled: {type: boolean}
            updatedAt: {type: string}
    ProviderActivity:
      type: object
      required: [id, tenantId, action, summary, createdAt]
      properties:
        id: {type: string}
        tenantId: {type: [string, "null"]}
        action: {type: string}
        summary: {type: string}
        createdAt: {type: string}
    ProviderFoundation:
      type: object
      required: [providers, assignments, policies, activity, categories, capabilities, credentialStorageAvailable, executionEnabled]
      properties:
        providers: {type: array, items: {$ref: "#/components/schemas/ProviderDefinition"}}
        assignments: {type: array, items: {$ref: "#/components/schemas/ProviderAssignment"}}
        policies: {type: array, items: {$ref: "#/components/schemas/ProviderPolicy"}}
        activity: {type: array, items: {$ref: "#/components/schemas/ProviderActivity"}}
        categories: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        credentialStorageAvailable: {type: boolean}
        executionEnabled: {type: boolean}
    PlatformCustomer:
      type: object
      required: [id, name, email, status, createdAt, tenantIds]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, "null"] }
        status: { type: string }
        createdAt: { type: [string, "null"] }
        tenantIds:
          type: array
          items: { type: string }
    PlatformProject:
      type: object
      required: [tenantId, customerIds, planId, planName, addonIds, logoUrl, updatedAt]
      properties:
        tenantId: { type: string }
        customerIds:
          type: array
          items: { type: string }
        planId: { type: [string, "null"] }
        planName: { type: [string, "null"] }
        addonIds:
          type: array
          items: { type: string }
        logoUrl: { type: [string, "null"] }
        updatedAt: { type: string }
    PlatformAudit:
      type: object
      required: [id, tenantId, actorId, eventType, description, resource, result, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: [string, "null"] }
        actorId: { type: string }
        eventType: { type: string }
        description: { type: string }
        resource: { type: [string, "null"] }
        result: { type: [string, "null"] }
        createdAt: { type: string }
    PlatformProvider:
      type: object
      required: [id, name, category, capabilities, status, logoUrl, implemented]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        capabilities:
          type: array
          items: { type: string }
        status: { type: string }
        logoUrl: { type: [string, "null"] }
        implemented: { type: boolean }
    PlatformManagement:
      type: object
      required: [customers, customerTotal, projects, audit, providers, directoryAvailable, directoryError]
      properties:
        customerTotal: { type: [integer, "null"] }
        customers:
          type: array
          items: { $ref: "#/components/schemas/PlatformCustomer" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/PlatformProject" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/PlatformAudit" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/PlatformProvider" }
        directoryAvailable: { type: boolean }
        directoryError: { type: [string, "null"] }
    WebsitePreview:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
    ExchangeVisualAsset:
      type: object
      required: [kind, code, name, logoUrl, alternatives, recordId, countries, currencies]
      properties:
        kind:
          type: string
          enum: [crypto, network, payment-method, flag, currency]
        code: {type: string}
        name: {type: string}
        logoUrl: {type: string}
        alternatives: {type: array, items: {type: string}}
        recordId: {type: [string, "null"]}
        countries: {type: array, items: {type: string}}
        currencies: {type: array, items: {type: string}}
    ExchangeVisualUnavailable:
      type: object
      required: [type, code, name, reason]
      properties:
        type: {type: string}
        code: {type: string}
        name: {type: string}
        reason: {type: string}
    ExchangeVisualCatalog:
      type: object
      required: [assets, unavailable, sandboxOnly]
      properties:
        assets:
          type: array
          items: {$ref: "#/components/schemas/ExchangeVisualAsset"}
        unavailable:
          type: array
          items: {$ref: "#/components/schemas/ExchangeVisualUnavailable"}
        sandboxOnly: {type: boolean}
    WhiteLabelStatus:
      type: string
      enum: [new, reviewing, waiting_for_client, quote_ready, approved, in_setup, customization, ready, delivered, rejected, cancelled]
    WhiteLabelDesign:
      type: object
      required: [type, styleName, primaryColor, accentColor, themePreference, description, referenceWebsiteUrl, notes, logoAttachmentId, faviconAttachmentId, referenceAttachmentIds]
      properties:
        type: {type: string, enum: [standard, custom]}
        styleName: {type: string, maxLength: 100}
        primaryColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        accentColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        themePreference: {type: string, enum: [light, dark, both]}
        description: {type: string, maxLength: 5000}
        referenceWebsiteUrl: {type: ["string", "null"], maxLength: 2048}
        notes: {type: string, maxLength: 5000}
        logoAttachmentId: {type: ["string", "null"], format: uuid}
        faviconAttachmentId: {type: ["string", "null"], format: uuid}
        referenceAttachmentIds: {type: array, maxItems: 10, items: {type: string, format: uuid}}
    WhiteLabelAttachment:
      type: object
      required: [id, fileName, contentType, size, category, createdAt]
      properties:
        id: {type: string, format: uuid}
        fileName: {type: string}
        contentType: {type: string}
        size: {type: integer}
        category: {type: string, enum: [logo, favicon, design_reference, requirement]}
        createdAt: {type: string, format: date-time}
    WhiteLabelCatalog:
      type: object
      required: [plans, addons, definitions]
      properties:
        plans: {type: array, items: {$ref: "#/components/schemas/Plan"}}
        addons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        definitions: {type: array, items: {$ref: "#/components/schemas/EntitlementDefinition"}}
    WhiteLabelEvent:
      type: object
      required: [id, kind, author, visibility, message, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [status, note]}
        author: {type: string}
        visibility: {type: string, enum: [internal, customer]}
        message: {type: string}
        status: {type: ["string", "null"]}
        createdAt: {type: string, format: date-time}
    WhiteLabelNoteInput:
      type: object
      required: [message, visibility]
      properties:
        message: {type: string, minLength: 1, maxLength: 5000}
        visibility: {type: string, enum: [internal, customer]}
    WhiteLabelOrderDetail:
      type: object
      required: [order, history]
      properties:
        order: {$ref: "#/components/schemas/WhiteLabelRequest"}
        history: {type: array, items: {$ref: "#/components/schemas/WhiteLabelEvent"}}
    ExchangeDeliveryInput:
      type: object
      required: [tenantId]
      properties: {tenantId: {type: string, format: uuid}}
    CustomerAdminPanel:
      type: object
      required: [tenantId, name, brandName, slug, status, role]
      properties:
        tenantId: {type: string, format: uuid}
        name: {type: string}
        brandName: {type: string}
        slug: {type: string}
        status: {type: string, enum: [active, suspended]}
        role: {type: string, enum: [client_admin, staff]}
    WhiteLabelRequestInput:
      type: object
      required: [projectName, brandName, preferredDomain, actions, details, idempotencyKey]
      properties:
        projectName: {type: string, minLength: 2, maxLength: 100}
        websiteName: {type: string, minLength: 2, maxLength: 120}
        brandName: {type: string, minLength: 2, maxLength: 100}
        preferredDomain: {type: string, minLength: 1, maxLength: 253, pattern: '\S'}
        actions: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {$ref: "#/components/schemas/ExchangeAction"}}
        details: {type: string, maxLength: 10000}
        companyName: {type: ["string", "null"], maxLength: 150}
        design: {$ref: "#/components/schemas/WhiteLabelDesign"}
        requestedPlanId: {type: ["string", "null"], format: uuid}
        requestedAddonIds: {type: array, maxItems: 20, items: {type: string, format: uuid}}
        billingPeriod: {type: string, enum: [monthly, yearly]}
        attachmentIds: {type: array, maxItems: 10, items: {type: string, format: uuid}}
        idempotencyKey: {type: string, format: uuid}
    WhiteLabelReviewInput:
      type: object
      required: [status, monthlyPrice, setupPrice, currency, operatorNote]
      properties:
        status: {$ref: "#/components/schemas/WhiteLabelStatus"}
        monthlyPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        setupPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        operatorNote: {type: string, maxLength: 5000}
        customizationPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        approvedPlanId: {type: ["string", "null"], format: uuid}
        approvedAddonIds: {type: array, maxItems: 20, items: {type: string, format: uuid}}
        customDesignDecision: {type: string, enum: [pending, approved, rejected]}
    WhiteLabelRequest:
      type: object
      required: [id, customerUserId, projectName, brandName, preferredDomain, actions, details, status, monthlyPrice, setupPrice, currency, operatorNote, tenantId, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        customerUserId: {type: string}
        projectName: {type: string}
        websiteName: {type: string}
        brandName: {type: string}
        preferredDomain: {type: ["string", "null"]}
        websiteUrl: {type: ["string", "null"]}
        adminPanelUrl: {type: ["string", "null"]}
        actions: {type: array, items: {$ref: "#/components/schemas/ExchangeAction"}}
        details: {type: string}
        status: {$ref: "#/components/schemas/WhiteLabelStatus"}
        orderReference: {type: string}
        companyName: {type: ["string", "null"]}
        design: {oneOf: [{$ref: "#/components/schemas/WhiteLabelDesign"}, {type: "null"}]}
        billingPeriod: {type: string, enum: [monthly, yearly]}
        requestedPlan: {oneOf: [{$ref: "#/components/schemas/Plan"}, {type: "null"}]}
        requestedAddons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        approvedPlan: {oneOf: [{$ref: "#/components/schemas/Plan"}, {type: "null"}]}
        approvedAddons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        attachments: {type: array, items: {$ref: "#/components/schemas/WhiteLabelAttachment"}}
        customizationPrice: {type: ["string", "null"]}
        customDesignDecision: {type: string, enum: [pending, approved, rejected]}
        monthlyPrice: {type: ["string", "null"]}
        setupPrice: {type: ["string", "null"]}
        currency: {type: ["string", "null"]}
        operatorNote: {type: string}
        tenantId: {type: ["string", "null"], format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExchangeAuditList:
      type: object
      required: [events, total, page, pageSize]
      properties:
        events: {type: array, items: {$ref: "#/components/schemas/ActivityEvent"}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    ExchangeAction:
      type: string
      enum: [swap, convert, buy, sell]
    ExchangeAssetSettings:
      type: object
      required: [assetId, enabled, displayOrder, symbol, decimals, logoUrl, sandboxPlanRate]
      properties:
        assetId: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        displayOrder: {type: integer, minimum: 0, maximum: 1000}
        symbol: {type: string, minLength: 1, maxLength: 12}
        decimals: {type: integer, minimum: 0, maximum: 18}
        logoUrl: {type: ["string", "null"], maxLength: 2000}
        sandboxPlanRate: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
    ExchangeNetworkSettings:
      type: object
      required: [assetNetworkId, enabled, available, minimum, maximum, fee, information]
      properties:
        assetNetworkId: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        available: {type: boolean}
        minimum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        maximum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        fee: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        information: {type: string, maxLength: 500}
        providerId: {type: string, maxLength: 80}
    ExchangeRoute:
      type: object
      required: [id, source, destination, action, enabled, rate, minimum, maximum, feeBps, fixedFee, spreadBps, paymentMethodIds]
      properties:
        id: {type: string, format: uuid}
        source: {type: string, minLength: 1, maxLength: 80}
