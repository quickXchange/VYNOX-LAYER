      properties: {status: {type: string, enum: [enabled, disabled, archived]}, expectedRevision: {type: integer, minimum: 0}}
      required: [status, expectedRevision]
    AddonInput:
      type: object
      properties:
        monthlyPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        yearlyPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        setupFee: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        discountPercent: {type: string, pattern: '^\d{1,3}(\.\d{1,2})?$', maxLength: 6}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 3000}
        enabled: {type: boolean}
        entitlements: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/EntitlementEntry"}}
      required: [name, description, enabled, entitlements]
    Addon:
      allOf:
        - {$ref: "#/components/schemas/AddonInput"}
        - type: object
          properties: {id: {type: string, format: uuid}, pricingConfigured: {type: boolean}}
          required: [id]
    SubscriptionPlanInput:
      type: object
      properties: {planId: {type: string, format: uuid}}
      required: [planId]
    SubscriptionAddonInput:
      type: object
      properties: {addonIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}}
      required: [addonIds]
    EntitlementOverride:
      allOf:
        - {$ref: "#/components/schemas/EntitlementEntry"}
        - type: object
          properties: {reason: {type: string, minLength: 2, maxLength: 500}}
          required: [reason]
    EntitlementOverrideInput:
      type: object
      properties: {overrides: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/EntitlementOverride"}}}
      required: [overrides]
    UsageItem:
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        used: {type: string}
        limit: {type: string}
        exceeded: {type: boolean}
      required: [key, label, used, limit, exceeded]
    TrialStartInput:
      type: object
      required: [planId, billingPeriod, publishedRevision, idempotencyKey, reason]
      properties:
        planId: {type: string, format: uuid}
        billingPeriod: {type: string, enum: [monthly, yearly]}
        publishedRevision: {type: string, minLength: 1}
        idempotencyKey: {type: string, format: uuid}
        reason: {type: string, minLength: 2, maxLength: 500}
    TrialActionInput:
      type: object
      required: [trialId, action, reason]
      properties:
        trialId: {type: string, format: uuid}
        action: {type: string, enum: [cancel, request_renewal]}
        reason: {type: string, minLength: 2, maxLength: 500}
    SubscriptionTrial:
      type: object
      required: [id, state, startedAt, endsAt, renewalRule, renewalRequestedAt, cancelledAt, publishedRevision, agreedRecurringPrice]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [active, cancelled, expired]}
        startedAt: {type: string}
        endsAt: {type: string}
        renewalRule: {type: string, enum: [manual_agreement_required]}
        renewalRequestedAt: {type: ["string", "null"]}
        cancelledAt: {type: ["string", "null"]}
        publishedRevision: {type: string}
        agreedRecurringPrice: {type: string}
    SubscriptionView:
      type: object
      properties:
        tenantId: {type: string, format: uuid}
        tenantStatus: {type: string}
        status: {type: string, enum: [active, suspended, cancelled, unassigned]}
        billingPeriod: {type: string, enum: [monthly, yearly]}
        discountPercent: {type: string}
        operatorNote: {type: string}
        recurringEstimate: {type: ["string", "null"]}
        currency: {type: ["string", "null"]}
        billingConnected: {type: boolean}
        trial:
          oneOf: [{$ref: "#/components/schemas/SubscriptionTrial"}, {type: "null"}]
        plan:
          oneOf: [{$ref: "#/components/schemas/Plan"}, {type: "null"}]
        addons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        overrides: {type: array, items: {$ref: "#/components/schemas/EntitlementOverride"}}
        features: {type: object, additionalProperties: {type: boolean}}
        limits: {type: object, additionalProperties: {type: string}}
        sources: {type: object, additionalProperties: {type: string}}
        usage: {type: array, items: {$ref: "#/components/schemas/UsageItem"}}
        enabledModules: {type: array, items: {type: string}}
        overLimit: {type: boolean}
      required: [tenantId, tenantStatus, status, plan, addons, overrides, features, limits, sources, usage, enabledModules, overLimit]
    SubscriptionCommercialInput:
      type: object
      properties:
        billingPeriod: {type: string, enum: [monthly, yearly]}
        discountPercent: {type: string, pattern: '^\d{1,3}(\.\d{1,2})?$', maxLength: 6}
        operatorNote: {type: string, maxLength: 2000}
        action: {type: string, enum: [save, cancel, restore]}
        reason: {type: string, minLength: 2, maxLength: 500}
      required: [billingPeriod, discountPercent, operatorNote, action, reason]
    NotificationReadInput:
      type: object
      properties:
        ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
      required: [ids]
    CustomerNotification:
      type: object
      properties:
        id: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        orderReference: {type: string}
        message: {type: string}
        status: {type: ["string", "null"]}
        createdAt: {type: string, format: date-time}
        readAt: {type: ["string", "null"], format: date-time}
      required: [id, requestId, orderReference, message, status, createdAt, readAt]
    CustomerNotifications:
      type: object
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CustomerNotification"}}
        unreadCount: {type: integer, minimum: 0}
        outboundConnected: {type: boolean}
      required: [items, unreadCount, outboundConnected]
    SuspensionInput:
      type: object
      properties: {suspended: {type: boolean}, reason: {type: string, minLength: 2, maxLength: 500}}
      required: [suspended, reason]
    WebsiteSettings:
      type: object
      properties:
        reviewLinks:
          type: array
          maxItems: 6
          items: {$ref: "#/components/schemas/SiteLink"}
        navigation:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              key: {type: string, enum: [exchange, payments, telegram, how, developers, about, faq]}
              label: {type: string, minLength: 1, maxLength: 60}
              visible: {type: boolean}
            required: [key, label, visible]
        secondaryColor: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        templateKey: {type: string, enum: [standard-exchange]}
        websiteName: {type: string, minLength: 2, maxLength: 120}
        sandboxLabel: {type: string, enum: [Sandbox, Sandbox Demo]}
        glowColor: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        surfaceStyle: {type: string, enum: [solid, glass]}
        borderRadius: {type: string, enum: [sharp, soft, rounded]}
        faq: {type: array, maxItems: 16, items: {$ref: "#/components/schemas/WebsiteFaq"}}
        faviconUrl: {type: ["string", "null"], maxLength: 2048}
        fontKey: {type: string, enum: [system, inter, manrope, dm-sans, space-grotesk]}
        heroTitle: {type: string, minLength: 2, maxLength: 180}
        heroSubtitle: {type: string, maxLength: 1000}
        supportEmail: {type: ["string", "null"], maxLength: 254}
        supportUrl: {type: ["string", "null"], maxLength: 2048}
        supportDetails: {type: string, maxLength: 2000}
        socialLinks: {type: array, maxItems: 12, items: {$ref: "#/components/schemas/SiteLink"}}
        footerText: {type: string, maxLength: 2000}
        privacyContent: {type: string, maxLength: 20000}
        termsContent: {type: string, maxLength: 20000}
      required: [secondaryColor, faviconUrl, fontKey, heroTitle, heroSubtitle, supportEmail, supportUrl, supportDetails, socialLinks, footerText, privacyContent, termsContent]
    WebsiteFaq:
      type: object
      properties:
        question: {type: string, minLength: 2, maxLength: 180}
        answer: {type: string, minLength: 2, maxLength: 2000}
      required: [question, answer]
    SiteLink:
      type: object
      properties: {label: {type: string, minLength: 1, maxLength: 80}, url: {type: string, maxLength: 2048}}
      required: [label, url]
    ResourceInput:
      type: object
      properties: {label: {type: string, minLength: 2, maxLength: 120}, reference: {type: ["string", "null"], maxLength: 2048}}
      required: [label, reference]
    ResourceItem:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        reference: {type: ["string", "null"]}
        status: {type: string}
        permissions: {type: array, items: {type: string}}
      required: [id, label, reference, status]
    ResourceCreated:
      type: object
      properties: {item: {$ref: "#/components/schemas/ResourceItem"}, issuedKey: {type: ["string", "null"]}}
      required: [item, issuedKey]
    MutationStatus:
      type: object
      properties: {ok: {type: boolean}}
      required: [ok]
    TenantReleaseMetadata:
      type: object
      properties:
        id: {type: string}
        version: {type: integer}
        checksum: {type: string}
        createdBy: {type: string}
        createdAt: {type: string}
        diff: {type: array, items: {type: string}}
      required: [id, version, checksum, createdBy, createdAt, diff]
    ReleaseChecklistItem:
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        ready: {type: boolean}
        message: {type: string}
      required: [key, label, ready, message]
    TenantReleaseState:
      type: object
      properties:
        liveReleaseId: {type: ["string", "null"]}
        liveChecksum: {type: ["string", "null"]}
        draftChecksum: {type: string}
        checklist: {type: array, items: {$ref: "#/components/schemas/ReleaseChecklistItem"}}
        history: {type: array, items: {$ref: "#/components/schemas/TenantReleaseMetadata"}}
      required: [liveReleaseId, liveChecksum, draftChecksum, checklist, history]
    ReleasedSiteConfig:
      type: object
      properties:
        schema_version: {type: integer}
        site: {$ref: "#/components/schemas/PublicSite"}
        exchange:
          anyOf:
            - {$ref: "#/components/schemas/PublicExchange"}
            - {type: "null"}
        addons: {type: array, items: {type: object, properties: {key: {type: string}, name: {type: string}}, required: [key, name]}}
        displayLimits: {type: object, additionalProperties: {type: ["string", "number", "boolean", "null"]}}
        providers: {type: array, items: {type: object, properties: {provider: {type: string}, configured: {type: boolean}}, required: [provider, configured]}}
      required: [schema_version, site, exchange, addons, displayLimits, providers]
    PublicSite:
      type: object
      properties:
        schema_version: {type: integer}
        releaseChecksum: {type: string}
        preview: {type: boolean}
        defaultLanguage: {type: string}
        supportedLanguages: {type: array, items: {type: string}}
        tenantSlug: {type: string}
        brandName: {type: string}
        logoUrl: {type: ["string", "null"]}
        primaryColor: {type: string}
        accentColor: {type: string}
        themeMode: {type: string, enum: [light, dark, system]}
        domain: {type: ["string", "null"]}
        sandboxOnly: {type: boolean}
        websiteSettings: {$ref: "#/components/schemas/WebsiteSettings"}
        features: {type: object, additionalProperties: {type: boolean}}
        assets: {type: array, items: {$ref: "#/components/schemas/AssetNetwork"}}
      required: [tenantSlug, brandName, logoUrl, primaryColor, accentColor, themeMode, domain, sandboxOnly, websiteSettings, features, assets]
    CapabilityStatus:
      type: object
      properties: {feature: {type: string}, status: {type: string}, message: {type: string}}
      required: [feature, status, message]
    ExchangeDefaultPair:
      type: object
      required: [source, destination]
      properties:
        source: {type: string, minLength: 1, maxLength: 80}
        destination: {type: string, minLength: 1, maxLength: 80}
        paymentMethodId: {type: string, format: uuid}
    GlobalCatalogEntry:
      type: object
      required: [kind, id, code, name, status, logoUrl, metadata, revision]
      properties:
        kind: {type: string, enum: [currencies, payment_methods, assets, networks]}
        id: {type: string, pattern: '^[A-Za-z0-9:_-]{1,100}$'}
        code: {type: string, minLength: 1, maxLength: 40}
        name: {type: string, minLength: 1, maxLength: 160}
        status: {type: string, enum: [enabled, disabled, catalog_only]}
        logoUrl: {type: ["string", "null"], maxLength: 2000}
        metadata: {type: object, additionalProperties: true}
        revision: {type: integer, minimum: 0}
    GlobalCatalogLink:
      type: object
      required: [kind, id, sourceId, targetId, enabled, verified, metadata]
      properties:
        kind: {type: string, enum: [payment_fiat, asset_network]}
        id: {type: string, pattern: '^[A-Za-z0-9:_-]{1,220}$'}
        sourceId: {type: string, minLength: 1, maxLength: 100}
        targetId: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        verified: {type: boolean}
        metadata: {type: object, additionalProperties: true}
    GlobalExchangeCatalog:
      type: object
      required: [entries, links]
      properties:
        entries: {type: array, items: {$ref: "#/components/schemas/GlobalCatalogEntry"}}
        links: {type: array, items: {$ref: "#/components/schemas/GlobalCatalogLink"}}
    GlobalCatalogPatch:
      type: object
      properties:
        entries: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/GlobalCatalogEntry"}}
        links: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/GlobalCatalogLink"}}
        deleteEntries:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/GlobalCatalogDeletion"}
    GlobalCatalogDeletion:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [currencies, payment_methods, assets, networks]}
        id: {type: string, minLength: 1, maxLength: 100}

